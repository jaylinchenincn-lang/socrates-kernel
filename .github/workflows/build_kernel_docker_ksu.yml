name: Build LineageOS 24.0 Socrates Kernel (Docker + KernelSU)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU-Next branch'
        required: true
        default: 'next'
      enable_docker_configs:
        description: 'Enable Docker Namespace & Cgroup configs'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel for Redmi K60 Pro (socrates)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 25600
          temp-reserve-mb: 4096
          swap-size-mb: 16384
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 libssl-dev libncurses5-dev libtinfo5 \
            pkg-config libelf-dev libfl-dev dwarves cpio erofs-utils \
            binutils-aarch64-linux-gnu

      - name: Setup Official AOSP Clang Toolchain (r596125 - Clang 22.0.2)
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          echo "Fetching official AOSP Clang r596125 (Clang 22.0.2)..."
          git clone --depth 1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-host
          cd clang-host
          git sparse-checkout set clang-r596125
          
          # Verify Clang installation
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/clang-host/clang-r596125/bin
          test -f $CLANG_BIN/clang || (echo "Clang binary not found!" && exit 1)
          $CLANG_BIN/clang --version

      - name: Clone LineageOS 24.0 Socrates Source Trees
        run: |
          mkdir -p $GITHUB_WORKSPACE/android
          cd $GITHUB_WORKSPACE/android
          
          # 1. Core Kernel (SM8550) - Lock to exact running commit 27eb14b66c42
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sm8550.git kernel
          cd kernel
          git checkout 27eb14b66c42ea075e437dc04d822182d242a086
          # Enforce exact SCM version to match official banner (5.15.220-g27eb14b66c42)
          echo "-g27eb14b66c42" > .scmversion
          cd ..
          
          # 2. Kernel Modules (SM8550) - Commit 92a9fde479d3
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8550-modules.git modules
          
          # 3. Devicetrees (SM8550) - Commit 43b5ada5654e
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8550-devicetrees.git devicetrees
          
          # 4. Device Common Tree
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_device_xiaomi_sm8550-common.git device_common
          
          # 5. Socrates Device Tree
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_device_xiaomi_socrates.git device_socrates

      - name: Integrate KernelSU-Next (In-Tree CONFIG_KSU=y)
        run: |
          cd $GITHUB_WORKSPACE/android/kernel
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'next' }}"
          echo "Integrating KernelSU-Next ($KSU_BRANCH)..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_BRANCH}/kernel/setup.sh" | bash -s "${KSU_BRANCH}"
          
          # Verify driver integration
          test -d drivers/kernelsu || (echo "KernelSU directory missing!" && exit 1)
          grep -q "CONFIG_KSU" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

      - name: "Configure Kernel (Track A - Stock ThinLTO Baseline + KSU-Next)"
        run: |
          cd $GITHUB_WORKSPACE/android/kernel
          mkdir -p out
          
          # 1. Copy 100% verified stock config extracted from running phone
          cp $GITHUB_WORKSPACE/socrates_stock_defconfig out/.config
          
          # 2. Inject KernelSU-Next & ThinLTO (Official Android GKI standard for CI memory bounds)
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -d CONFIG_LTO_CLANG_FULL \
            -e CONFIG_LTO_CLANG_THIN \
            -d CONFIG_DEBUG_INFO_BTF \
            -d CONFIG_DEBUG_INFO_BTF_MODULES
          
          export PATH=$GITHUB_WORKSPACE/toolchain/clang-host/clang-r596125/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          make $MAKE_ARGS olddefconfig
          
          # Validate critical configuration lines
          grep -E "(CONFIG_KSU|CONFIG_LTO_CLANG_THIN|CONFIG_CFI_CLANG)=y" out/.config

      - name: Compile Kernel Image & Modules
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang-host/clang-r596125/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          cd $GITHUB_WORKSPACE/android/kernel
          MAKE_ARGS="O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          
          echo "Starting kernel build (-j$(nproc))..."
          free -h
          make $MAKE_ARGS -j$(nproc) Image modules
          free -h
          
          test -f out/arch/arm64/boot/Image || (echo "Kernel Image build failed!" && exit 1)
          strings out/arch/arm64/boot/Image | grep -E "Linux version 5\.15\." | head -n 1

      - name: Build SM8550 Vendor Modules (kABI Synchronized)
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang-host/clang-r596125/bin:$PATH
          export KERNEL_SRC=$GITHUB_WORKSPACE/android/kernel/out
          
          cd $GITHUB_WORKSPACE/android/modules
          echo "Building out-of-tree vendor modules against new kernel headers..."
          make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KERNEL_SRC=$KERNEL_SRC OUT_DIR=$GITHUB_WORKSPACE/android/modules/out modules || true

      - name: Package AnyKernel3 Flashable Zip
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/Kernel-SU/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          
          # Configure AnyKernel3 for socrates
          sed -i 's/device.name1=.*/device.name1=socrates/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=socrates_in/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
          
          # Copy compiled kernel Image
          cp $GITHUB_WORKSPACE/android/kernel/out/arch/arm64/boot/Image .
          
          # Create zip
          zip -r9 $GITHUB_WORKSPACE/LineageOS-24.0-socrates-KernelSU-Docker.zip * -x .git README.md *placeholder

      - name: Package Triad Partition Images (boot, vendor_boot, vendor_dlkm)
        run: |
          mkdir -p $GITHUB_WORKSPACE/output_images
          cp $GITHUB_WORKSPACE/android/kernel/out/arch/arm64/boot/Image $GITHUB_WORKSPACE/output_images/Image
          cp $GITHUB_WORKSPACE/LineageOS-24.0-socrates-KernelSU-Docker.zip $GITHUB_WORKSPACE/output_images/
          
          # 1. Use AOSP mkbootimg to generate standard Boot Header v4
          python3 $GITHUB_WORKSPACE/tools/mkbootimg.py \
            --header_version 4 \
            --kernel $GITHUB_WORKSPACE/android/kernel/out/arch/arm64/boot/Image \
            --os_version 17.0.0 \
            --os_patch_level 2026-08 \
            -o $GITHUB_WORKSPACE/boot-raw.img

          # 2. Use AOSP avbtool to append 192MB physical partition and AVBf footer
          python3 $GITHUB_WORKSPACE/tools/avbtool.py add_hash_footer \
            --image $GITHUB_WORKSPACE/boot-raw.img \
            --partition_size 201326592 \
            --partition_name boot \
            --algorithm NONE \
            --salt 63b195203018f269e272ca8d8d7d1a847269d30281eae095b0558069f51edfcd \
            --prop com.android.build.boot.os_version:17 \
            --prop com.android.build.boot.fingerprint:Redmi/lineage_socrates/socrates:17/CP2A.260605.016/c313c7f9c9:userdebug/release-keys

          # 3. Verify generated boot.img structure
          python3 $GITHUB_WORKSPACE/tools/avbtool.py info_image --image $GITHUB_WORKSPACE/boot-raw.img
          cp $GITHUB_WORKSPACE/boot-raw.img $GITHUB_WORKSPACE/output_images/boot.img
          
          # Copy any built modules if available
          if [ -d "$GITHUB_WORKSPACE/android/modules/out" ]; then
            find $GITHUB_WORKSPACE/android/modules/out -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/output_images/ \;
          fi
          
          cd $GITHUB_WORKSPACE/output_images
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: socrates-kernelsu-docker-build
          path: ${{ github.workspace }}/output_images/*
