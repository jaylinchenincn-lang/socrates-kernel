name: Build LineageOS 24.0 Socrates Kernel (Docker + KernelSU)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU-Next branch'
        required: true
        default: 'next'
      enable_docker_configs:
        description: 'Enable Docker Namespace & Cgroup configs'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel for Redmi K60 Pro (socrates)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 libssl-dev libncurses5-dev \
            pkg-config libelf-dev libfl-dev dwarves cpio erofs-utils

      - name: Setup AOSP Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          echo "Downloading AOSP Clang r416183b..."
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang || git clone --depth 1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b.git clang
          echo "Downloading AOSP GCC cross compilers..."
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Clone LineageOS 24.0 Socrates Source Trees
        run: |
          mkdir -p $GITHUB_WORKSPACE/android
          cd $GITHUB_WORKSPACE/android
          
          # 1. Core Kernel (SM8550) - Commit 27eb14b66c42
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8550.git kernel
          
          # 2. Kernel Modules (SM8550) - Commit 92a9fde479d3
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8550-modules.git modules
          
          # 3. Devicetrees (SM8550) - Commit 43b5ada5654e
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8550-devicetrees.git devicetrees
          
          # 4. Device Common Tree
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_device_xiaomi_sm8550-common.git device_common
          
          # 5. Socrates Device Tree
          git clone --depth 1 -b lineage-24.0 https://github.com/LineageOS/android_device_xiaomi_socrates.git device_socrates

      - name: Integrate KernelSU-Next (In-Tree CONFIG_KSU=y)
        run: |
          cd $GITHUB_WORKSPACE/android/kernel
          echo "Integrating KernelSU-Next (${{ github.event.inputs.ksu_branch }})..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ github.event.inputs.ksu_branch }}/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksu_branch }}
          
          # Verify driver integration
          test -d drivers/kernelsu || (echo "KernelSU directory missing!" && exit 1)
          grep -q "CONFIG_KSU" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

      - name: Inject Docker Kernel Configurations
        if: ${{ github.event.inputs.enable_docker_configs == 'true' }}
        run: |
          cd $GITHUB_WORKSPACE/android/kernel
          echo "Injecting Docker compatibility configurations..."
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          
          # =================================================================
          # Docker & Container Virtualization Configurations (Injected)
          # =================================================================
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NET_SCH_HTB=y
          CONFIG_NET_CLS_U32=y
          CONFIG_NET_CLS_FW=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_KSU=y
          EOF

      - name: Compile Kernel Image & Modules
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          cd $GITHUB_WORKSPACE/android/kernel
          mkdir -p out
          
          echo "Generating defconfig (gki_defconfig + vendor configs)..."
          make O=out gki_defconfig
          make O=out vendor/kalama_GKI.config
          make O=out vendor/socrates_GKI.config
          
          # Re-apply Docker configs after defconfig merge
          scripts/config --file out/.config \
            -e CONFIG_PID_NS \
            -e CONFIG_IPC_NS \
            -e CONFIG_USER_NS \
            -e CONFIG_CGROUP_DEVICE \
            -e CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            -e CONFIG_BRIDGE_NETFILTER \
            -e CONFIG_POSIX_MQUEUE \
            -e CONFIG_KSU
          
          make O=out olddefconfig
          
          echo "Starting kernel build (-j$(nproc))..."
          make O=out -j$(nproc) Image modules
          
          # Check kernel binary output
          test -f out/arch/arm64/boot/Image || (echo "Kernel Image build failed!" && exit 1)

      - name: Build SM8550 Vendor Modules (kABI Synchronized)
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          export KERNEL_SRC=$GITHUB_WORKSPACE/android/kernel/out
          
          cd $GITHUB_WORKSPACE/android/modules
          echo "Building out-of-tree vendor modules against new kernel headers..."
          make -j$(nproc) KERNEL_SRC=$KERNEL_SRC OUT_DIR=$GITHUB_WORKSPACE/android/modules/out modules || true

      - name: Package AnyKernel3 Flashable Zip
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/Kernel-SU/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          
          # Configure AnyKernel3 for socrates
          sed -i 's/device.name1=.*/device.name1=socrates/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=socrates_in/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
          
          # Copy compiled kernel Image
          cp $GITHUB_WORKSPACE/android/kernel/out/arch/arm64/boot/Image .
          
          # Create zip
          zip -r9 $GITHUB_WORKSPACE/LineageOS-24.0-socrates-KernelSU-Docker.zip * -x .git README.md *placeholder

      - name: Package Triad Partition Images (boot, vendor_boot, vendor_dlkm)
        run: |
          mkdir -p $GITHUB_WORKSPACE/output_images
          cp $GITHUB_WORKSPACE/android/kernel/out/arch/arm64/boot/Image $GITHUB_WORKSPACE/output_images/Image
          cp $GITHUB_WORKSPACE/LineageOS-24.0-socrates-KernelSU-Docker.zip $GITHUB_WORKSPACE/output_images/
          
          cd $GITHUB_WORKSPACE/output_images
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: socrates-kernelsu-docker-build
          path: ${{ github.workspace }}/output_images/*
